# -----------------------------------------------------------------------------
# Render Blueprint — Meta Pro backend (FastAPI + uvicorn)
#
# Deploy: push this repo to GitHub/GitLab, then in the Render dashboard choose
#   New + → Blueprint and select the repo. If render.yaml isn't auto-detected
#   (it lives at backend/render.yaml), point Render at this file during setup.
#
# Python version: pinned to Python 3.11 (latest patch) via backend/.python-version.
#   Render's default for new services is 3.14+ — this file keeps the runtime
#   reproducible. Change it there if you need a different version.
#
# Secrets (DATABASE_URL, MISTRAL_API_KEY, GROQ_API_KEY) are declared with
#   `sync: false` so they are set once in the dashboard (Settings → Environment)
#   and never stored in this file. The app refuses to start in production until
#   DATABASE_URL and MISTRAL_API_KEY are configured (see app/config.py).
# -----------------------------------------------------------------------------
services:
  - type: web
    name: meta-pro-backend
    runtime: python
    plan: free
    region: oregon
    # Monorepo: this service's code lives in backend/. Remove this key if you
    # deploy the backend/ directory as its own repository root instead.
    rootDir: backend
    # Rebuild + redeploy on every push to the linked branch (Render's current
    # field; equivalent to the classic `autoDeploy: true`).
    autoDeployTrigger: commit
    healthCheckPath: /api/health
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENVIRONMENT
        value: production
      # Comma-separated browser origins — your deployed Vercel frontend
      # domain(s). No trailing slash: origins are matched exactly against the
      # browser Origin header. Development mode ignores this (wildcard CORS).
      - key: ALLOWED_ORIGINS
        value: https://meta-pro-five.vercel.app
      # --- Secrets: set these in the Render dashboard (Settings → Environment)
      - key: DATABASE_URL
        sync: false
      - key: MISTRAL_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
